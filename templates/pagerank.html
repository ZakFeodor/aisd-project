<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PageRank</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="container">
<h1>PageRank</h1>
<img class="graph-image" src="https://avatars.dzeninfra.ru/get-zen_doc/271828/pub_66ad0bb4dd98fa03adbc0bfa_66ad0e44a328f35f90208f63/scale_1200" alt="Граф" width="300">
<h2>Результат для этого графа</h2>
<ul class="result-list">
{% for node, rank in result.items() %}
    <li>
        <td>{{ node }}</td>
        <td>{{ "%.2f" | format(rank) }}</td>
    </li>
{% endfor %}
</ul>
<div class="nav-buttons">
<form action="/main_page">
    <input type="submit" value="Назад">
</form>
</div>
</div>
</body>
</html>
