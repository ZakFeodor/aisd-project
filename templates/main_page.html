<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главная</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="container">
<h1>Добро пожаловать</h1>
{% if error %}
    <p class="error-message">{{ error }}</p>
{% endif %}
<form action="/main_page/upload" method="post" enctype="multipart/form-data">
    <div class="form-group">
        <input type="file" name="file">
    </div>
    <button type="submit">Отправить файл</button>
</form>
<div class="nav-buttons">
<form action="/main_page/get_hashmap">
    <button type="submit">Получить информацию по HashMap</button>
</form>
<form action="/main_page/get_segment_tree">
    <button type="submit">Получить информацию по Segment Tree</button>
</form>
<form action="/main_page/PageRank">
    <button type="submit">Получить информацию по PageRank</button>
</form>
<form action="/main_page/smoothsort">
    <button type="submit">Получить информацию по Smooth Sort</button>
</form>
<form action="/">
    <button type="submit" class="btn-secondary">Выйти из аккаунта</button>
</form>
</div>
</div>
</body>
</html>
