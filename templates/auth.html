<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% if error %}
    <p style="color: red">{{ error }}</p>
{% endif %}
<h1>Введите логин и пароль для входа или зарегистрируйтесь</h1>
<form action="http://127.0.0.1:8000/auth_check" method="post">
    <label>Логин</label><input type="text" name="login" required>
    <label>Пароль</label><input type="password" name="password" required>
    <button type="submit">Войти</button>
</form>
<form action="http://127.0.0.1:8000/register">
    <input type="submit" value="Регистрация">
</form>
</body>
</html>
