<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Загрузка файла</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="container">
<h1>Загрузка файла</h1>
<form action="/main_page/{{ name }}/upload" method="post" enctype="multipart/form-data">

        <input type="file" name="file">
    </div>
    <button type="submit">Загрузить</button>
</form>
<div class="nav-buttons">
<form action="/">
    <button type="submit" class="btn-secondary">Выйти из аккаунта</button>
</form>
</div>
</div>
</body>
</html>
